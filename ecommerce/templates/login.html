<!DOCTYPE html>
{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h2 class="text-center mb-1 fw-bold">Welcome Back</h2>
                    <p class="text-center text-muted mb-4">Login to your account</p>

                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Username</label>
                            <input type="text" class="form-control" name="u" placeholder="Enter username">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Password</label>
                            <input type="password" class="form-control" name="p" placeholder="Enter password">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-3 fs-5 fw-semibold rounded-3">Login</button>
                    </form>

                    <p class="text-center mt-3 mb-0 text-muted">
                        Don't have an account? <a href="{% url 'shop:register' %}">Register</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
