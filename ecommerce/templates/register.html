<!DOCTYPE html>
{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h2 class="text-center mb-1 fw-bold">Create Account</h2>
                    <p class="text-center text-muted mb-4">Join our fashion store</p>

                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="row">
                            <div class="col-sm-6 mb-3">
                                <label class="form-label fw-semibold">First Name</label>
                                <input type="text" class="form-control" name="f" placeholder="First name">
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label class="form-label fw-semibold">Last Name</label>
                                <input type="text" class="form-control" name="l" placeholder="Last name">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Username</label>
                            <input type="text" class="form-control" name="u" placeholder="Choose a username">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" class="form-control" name="e" placeholder="Your email address">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Password</label>
                            <input type="password" class="form-control" name="p" placeholder="Create a password">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Confirm Password</label>
                            <input type="password" class="form-control" name="cp" placeholder="Confirm your password">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-3 fs-5 fw-semibold rounded-3">Register</button>
                    </form>

                    <p class="text-center mt-3 mb-0 text-muted">
                        Already have an account? <a href="{% url 'shop:login' %}">Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
